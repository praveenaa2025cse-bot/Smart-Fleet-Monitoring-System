<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Smart Fleet Management System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <h1>Smart Fleet Management</h1>
    <div class="subtitle">Sign in to manage your fleet</div>

    <div class="error-message" id="error-box"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required />
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">Login</button>
    </form>

    <div class="hint">
      Sample login credentials &mdash; Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>admin</strong>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // If already logged in, skip straight to the dashboard.
    if (getCurrentUser()) {
      window.location.href = "dashboard.html";
    }

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error-box");
    const loginBtn = document.getElementById("login-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("show");

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in...";

      try {
        const result = await api.post("/login", { username, password });
        sessionStorage.setItem("fleetUser", JSON.stringify(result));
        window.location.href = "dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message || "Invalid username or password";
        errorBox.classList.add("show");
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
