<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trips - Smart Fleet Management System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <div class="modal-overlay" id="trip-modal">
    <div class="modal">
      <h3 id="modal-title">Create Trip</h3>
      <form id="trip-form">
        <input type="hidden" id="trip-id" />
        <div class="form-group">
          <label>Vehicle</label>
          <select id="trip-vehicle" required></select>
        </div>
        <div class="form-group">
          <label>Driver</label>
          <select id="trip-driver" required></select>
        </div>
        <div class="form-group">
          <label>Source</label>
          <input type="text" id="trip-source" placeholder="e.g. Chennai" required />
        </div>
        <div class="form-group">
          <label>Destination</label>
          <input type="text" id="trip-destination" placeholder="e.g. Bangalore" required />
        </div>
        <div class="form-group">
          <label>Distance (km)</label>
          <input type="number" step="0.1" id="trip-distance" placeholder="e.g. 350" required />
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="trip-date" required />
        </div>
        <div class="form-group">
          <label>Trip Status</label>
          <select id="trip-status" required>
            <option value="PENDING">Pending</option>
            <option value="ONGOING">Ongoing</option>
            <option value="COMPLETED">Completed</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeTripModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Trip</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    renderShell("trips.html", "Trip Management");

    const content = document.getElementById("page-content");
    content.innerHTML = `
      <div class="toolbar">
        <div class="search-box">
          <span>Filter:</span>
          <select id="status-filter" style="border:none;outline:none;font-size:13px;margin-left:6px;">
            <option value="">All Trips</option>
            <option value="PENDING">Pending</option>
            <option value="ONGOING">Ongoing</option>
            <option value="COMPLETED">Completed</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="openTripModal()">+ Create Trip</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Vehicle</th><th>Driver</th><th>Source</th><th>Destination</th>
              <th>Distance</th><th>Date</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="trip-table-body">
            <tr><td colspan="9" class="empty-note">Loading trips...</td></tr>
          </tbody>
        </table>
      </div>
    `;

    const modal = document.getElementById("trip-modal");
    const form = document.getElementById("trip-form");

    async function loadDropdownOptions(selectedVehicleId, selectedDriverId) {
      const [vehicles, drivers] = await Promise.all([api.get("/vehicles"), api.get("/drivers")]);

      const vehicleSelect = document.getElementById("trip-vehicle");
      vehicleSelect.innerHTML = vehicles.map((v) =>
        `<option value="${v.vehicleId}">${escapeHtml(v.vehicleNumber)} (${escapeHtml(v.type)})</option>`
      ).join("");
      if (selectedVehicleId) vehicleSelect.value = selectedVehicleId;

      const driverSelect = document.getElementById("trip-driver");
      driverSelect.innerHTML = drivers.map((d) =>
        `<option value="${d.driverId}">${escapeHtml(d.name)}</option>`
      ).join("");
      if (selectedDriverId) driverSelect.value = selectedDriverId;
    }

    async function openTripModal(trip) {
      document.getElementById("modal-title").textContent = trip ? "Edit Trip" : "Create Trip";
      document.getElementById("trip-id").value = trip ? trip.tripId : "";
      await loadDropdownOptions(
        trip ? trip.vehicle.vehicleId : "",
        trip ? trip.driver.driverId : ""
      );
      document.getElementById("trip-source").value = trip ? trip.source : "";
      document.getElementById("trip-destination").value = trip ? trip.destination : "";
      document.getElementById("trip-distance").value = trip ? trip.distance : "";
      document.getElementById("trip-date").value = trip ? trip.tripDate : "";
      document.getElementById("trip-status").value = trip ? trip.tripStatus : "PENDING";
      modal.classList.add("show");
    }

    function closeTripModal() {
      modal.classList.remove("show");
      form.reset();
    }

    async function loadTrips(status) {
      const tbody = document.getElementById("trip-table-body");
      tbody.innerHTML = `<tr><td colspan="9" class="empty-note">Loading trips...</td></tr>`;
      try {
        const query = status ? `?status=${status}` : "";
        const trips = await api.get(`/trips${query}`);

        if (!trips.length) {
          tbody.innerHTML = `<tr><td colspan="9" class="empty-note">No trips found.</td></tr>`;
          return;
        }

        tbody.innerHTML = trips.map((t) => `
          <tr>
            <td>${t.tripId}</td>
            <td>${escapeHtml(t.vehicle.vehicleNumber)}</td>
            <td>${escapeHtml(t.driver.name)}</td>
            <td>${escapeHtml(t.source)}</td>
            <td>${escapeHtml(t.destination)}</td>
            <td>${t.distance} km</td>
            <td>${t.tripDate}</td>
            <td>${formatStatusBadge(t.tripStatus)}</td>
            <td class="actions-cell">
              <button class="btn btn-sm btn-secondary" onclick='editTrip(${JSON.stringify(t).replace(/'/g, "&#39;")})'>Edit</button>
              <button class="btn btn-sm btn-danger" onclick="deleteTrip(${t.tripId})">Delete</button>
            </td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="9" class="empty-note">Failed to load trips: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    function editTrip(trip) {
      openTripModal(trip);
    }

    async function deleteTrip(id) {
      if (!confirm("Delete this trip? This cannot be undone.")) return;
      try {
        await api.del(`/trips/${id}`);
        loadTrips(document.getElementById("status-filter").value);
      } catch (err) {
        showToastError("Failed to delete trip: " + err.message);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("trip-id").value;
      const payload = {
        vehicleId: Number(document.getElementById("trip-vehicle").value),
        driverId: Number(document.getElementById("trip-driver").value),
        source: document.getElementById("trip-source").value.trim(),
        destination: document.getElementById("trip-destination").value.trim(),
        distance: Number(document.getElementById("trip-distance").value),
        tripDate: document.getElementById("trip-date").value,
        tripStatus: document.getElementById("trip-status").value,
      };

      try {
        if (id) {
          await api.put(`/trips/${id}`, payload);
        } else {
          await api.post("/trips", payload);
        }
        closeTripModal();
        loadTrips(document.getElementById("status-filter").value);
      } catch (err) {
        showToastError("Failed to save trip: " + err.message);
      }
    });

    document.getElementById("status-filter").addEventListener("change", (e) => {
      loadTrips(e.target.value);
    });

    loadTrips();
  </script>
</body>
</html>
