<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drivers - Smart Fleet Management System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <div class="modal-overlay" id="driver-modal">
    <div class="modal">
      <h3 id="modal-title">Add Driver</h3>
      <form id="driver-form">
        <input type="hidden" id="driver-id" />
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="driver-name" placeholder="e.g. Ravi Kumar" required />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="driver-phone" placeholder="e.g. 9876543210" required />
        </div>
        <div class="form-group">
          <label>License Number</label>
          <input type="text" id="driver-license" placeholder="e.g. TN-DL-000111" required />
        </div>
        <div class="form-group">
          <label>Assigned Vehicle</label>
          <select id="driver-vehicle">
            <option value="">-- Not Assigned --</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeDriverModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Driver</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    renderShell("drivers.html", "Driver Management");

    const content = document.getElementById("page-content");
    content.innerHTML = `
      <div class="toolbar">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" id="search-input" placeholder="Search by name or license number..." />
        </div>
        <button class="btn btn-primary" onclick="openDriverModal()">+ Add Driver</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Name</th><th>Phone</th><th>License No.</th><th>Assigned Vehicle</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="driver-table-body">
            <tr><td colspan="6" class="empty-note">Loading drivers...</td></tr>
          </tbody>
        </table>
      </div>
    `;

    const modal = document.getElementById("driver-modal");
    const form = document.getElementById("driver-form");
    let vehicleOptionsCache = [];

    async function loadVehicleOptions(selectedId) {
      try {
        vehicleOptionsCache = await api.get("/vehicles");
      } catch (e) {
        vehicleOptionsCache = [];
      }
      const select = document.getElementById("driver-vehicle");
      const availableOrSelected = vehicleOptionsCache.filter(
        (v) => v.status !== "UNDER_MAINTENANCE" || (selectedId && v.vehicleId === selectedId)
      );
      select.innerHTML = `<option value="">-- Not Assigned --</option>` + availableOrSelected.map((v) =>
        `<option value="${v.vehicleId}">${escapeHtml(v.vehicleNumber)} (${escapeHtml(v.type)})</option>`
      ).join("");
      if (selectedId) select.value = selectedId;
    }

    async function openDriverModal(driver) {
      document.getElementById("modal-title").textContent = driver ? "Edit Driver" : "Add Driver";
      document.getElementById("driver-id").value = driver ? driver.driverId : "";
      document.getElementById("driver-name").value = driver ? driver.name : "";
      document.getElementById("driver-phone").value = driver ? driver.phoneNumber : "";
      document.getElementById("driver-license").value = driver ? driver.licenseNumber : "";
      await loadVehicleOptions(driver && driver.assignedVehicle ? driver.assignedVehicle.vehicleId : "");
      modal.classList.add("show");
    }

    function closeDriverModal() {
      modal.classList.remove("show");
      form.reset();
    }

    async function loadDrivers(keyword) {
      const tbody = document.getElementById("driver-table-body");
      tbody.innerHTML = `<tr><td colspan="6" class="empty-note">Loading drivers...</td></tr>`;
      try {
        const query = keyword ? `?search=${encodeURIComponent(keyword)}` : "";
        const drivers = await api.get(`/drivers${query}`);

        if (!drivers.length) {
          tbody.innerHTML = `<tr><td colspan="6" class="empty-note">No drivers found.</td></tr>`;
          return;
        }

        tbody.innerHTML = drivers.map((d) => `
          <tr>
            <td>${d.driverId}</td>
            <td>${escapeHtml(d.name)}</td>
            <td>${escapeHtml(d.phoneNumber)}</td>
            <td>${escapeHtml(d.licenseNumber)}</td>
            <td>${d.assignedVehicle ? escapeHtml(d.assignedVehicle.vehicleNumber) : '<span class="text-muted">Not assigned</span>'}</td>
            <td class="actions-cell">
              <button class="btn btn-sm btn-secondary" onclick='editDriver(${JSON.stringify(d).replace(/'/g, "&#39;")})'>Edit</button>
              <button class="btn btn-sm btn-danger" onclick="deleteDriver(${d.driverId})">Delete</button>
            </td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-note">Failed to load drivers: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    function editDriver(driver) {
      openDriverModal(driver);
    }

    async function deleteDriver(id) {
      if (!confirm("Delete this driver? This cannot be undone.")) return;
      try {
        await api.del(`/drivers/${id}`);
        loadDrivers(document.getElementById("search-input").value);
      } catch (err) {
        showToastError("Failed to delete driver: " + err.message);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("driver-id").value;
      const vehicleVal = document.getElementById("driver-vehicle").value;
      const payload = {
        name: document.getElementById("driver-name").value.trim(),
        phoneNumber: document.getElementById("driver-phone").value.trim(),
        licenseNumber: document.getElementById("driver-license").value.trim(),
        assignedVehicleId: vehicleVal ? Number(vehicleVal) : null,
      };

      try {
        if (id) {
          await api.put(`/drivers/${id}`, payload);
        } else {
          await api.post("/drivers", payload);
        }
        closeDriverModal();
        loadDrivers(document.getElementById("search-input").value);
      } catch (err) {
        showToastError("Failed to save driver: " + err.message);
      }
    });

    let searchTimer;
    document.getElementById("search-input").addEventListener("input", (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => loadDrivers(e.target.value), 300);
    });

    loadDrivers();
  </script>
</body>
</html>
