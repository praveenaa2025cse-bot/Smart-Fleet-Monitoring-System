<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuel Management - Smart Fleet Management System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <div class="modal-overlay" id="fuel-modal">
    <div class="modal">
      <h3 id="modal-title">Add Fuel Record</h3>
      <form id="fuel-form">
        <input type="hidden" id="fuel-id" />
        <div class="form-group">
          <label>Vehicle</label>
          <select id="fuel-vehicle" required></select>
        </div>
        <div class="form-group">
          <label>Fuel Type</label>
          <select id="fuel-type" required>
            <option value="PETROL">Petrol</option>
            <option value="DIESEL">Diesel</option>
            <option value="CNG">CNG</option>
            <option value="ELECTRIC">Electric</option>
          </select>
        </div>
        <div class="form-group">
          <label>Quantity (litres / units)</label>
          <input type="number" step="0.1" id="fuel-quantity" required />
        </div>
        <div class="form-group">
          <label>Cost (₹)</label>
          <input type="number" step="0.01" id="fuel-cost" required />
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="fuel-date" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeFuelModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Record</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    renderShell("fuel.html", "Fuel Management");

    const content = document.getElementById("page-content");
    content.innerHTML = `
      <div class="stat-grid" style="grid-template-columns: repeat(2, 1fr);" id="fuel-stats"></div>
      <div class="toolbar">
        <div></div>
        <button class="btn btn-primary" onclick="openFuelModal()">+ Add Fuel Record</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Vehicle</th><th>Fuel Type</th><th>Quantity</th><th>Cost</th><th>Date</th><th>Actions</th></tr>
          </thead>
          <tbody id="fuel-table-body">
            <tr><td colspan="7" class="empty-note">Loading fuel records...</td></tr>
          </tbody>
        </table>
      </div>
    `;

    const modal = document.getElementById("fuel-modal");
    const form = document.getElementById("fuel-form");

    async function loadVehicleDropdown(selectedId) {
      const vehicles = await api.get("/vehicles");
      const select = document.getElementById("fuel-vehicle");
      select.innerHTML = vehicles.map((v) =>
        `<option value="${v.vehicleId}">${escapeHtml(v.vehicleNumber)} (${escapeHtml(v.type)})</option>`
      ).join("");
      if (selectedId) select.value = selectedId;
    }

    async function openFuelModal(record) {
      document.getElementById("modal-title").textContent = record ? "Edit Fuel Record" : "Add Fuel Record";
      document.getElementById("fuel-id").value = record ? record.fuelId : "";
      await loadVehicleDropdown(record ? record.vehicle.vehicleId : "");
      document.getElementById("fuel-type").value = record ? record.fuelType : "PETROL";
      document.getElementById("fuel-quantity").value = record ? record.quantity : "";
      document.getElementById("fuel-cost").value = record ? record.cost : "";
      document.getElementById("fuel-date").value = record ? record.recordDate : "";
      modal.classList.add("show");
    }

    function closeFuelModal() {
      modal.classList.remove("show");
      form.reset();
    }

    async function loadFuelStats() {
      try {
        const res = await api.get("/fuel/total-expense");
        document.getElementById("fuel-stats").innerHTML = `
          <div class="stat-card accent-warning">
            <div class="stat-label">Total Fuel Expenses</div>
            <div class="stat-value">${formatCurrency(res.totalFuelExpense)}</div>
          </div>
        `;
      } catch (e) { /* ignore */ }
    }

    async function loadFuelRecords() {
      const tbody = document.getElementById("fuel-table-body");
      tbody.innerHTML = `<tr><td colspan="7" class="empty-note">Loading fuel records...</td></tr>`;
      try {
        const records = await api.get("/fuel");
        if (!records.length) {
          tbody.innerHTML = `<tr><td colspan="7" class="empty-note">No fuel records found.</td></tr>`;
          return;
        }
        tbody.innerHTML = records.map((r) => `
          <tr>
            <td>${r.fuelId}</td>
            <td>${escapeHtml(r.vehicle.vehicleNumber)}</td>
            <td>${escapeHtml(r.fuelType)}</td>
            <td>${r.quantity}</td>
            <td>${formatCurrency(r.cost)}</td>
            <td>${r.recordDate}</td>
            <td class="actions-cell">
              <button class="btn btn-sm btn-secondary" onclick='editFuel(${JSON.stringify(r).replace(/'/g, "&#39;")})'>Edit</button>
              <button class="btn btn-sm btn-danger" onclick="deleteFuel(${r.fuelId})">Delete</button>
            </td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-note">Failed to load fuel records: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    function editFuel(record) {
      openFuelModal(record);
    }

    async function deleteFuel(id) {
      if (!confirm("Delete this fuel record?")) return;
      try {
        await api.del(`/fuel/${id}`);
        loadFuelRecords();
        loadFuelStats();
      } catch (err) {
        showToastError("Failed to delete fuel record: " + err.message);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("fuel-id").value;
      const payload = {
        vehicleId: Number(document.getElementById("fuel-vehicle").value),
        fuelType: document.getElementById("fuel-type").value,
        quantity: Number(document.getElementById("fuel-quantity").value),
        cost: Number(document.getElementById("fuel-cost").value),
        recordDate: document.getElementById("fuel-date").value,
      };
      try {
        if (id) {
          await api.put(`/fuel/${id}`, payload);
        } else {
          await api.post("/fuel", payload);
        }
        closeFuelModal();
        loadFuelRecords();
        loadFuelStats();
      } catch (err) {
        showToastError("Failed to save fuel record: " + err.message);
      }
    });

    loadFuelStats();
    loadFuelRecords();
  </script>
</body>
</html>
