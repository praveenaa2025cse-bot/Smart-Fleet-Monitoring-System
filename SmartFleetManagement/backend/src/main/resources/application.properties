# ===================================================================
# Smart Fleet Management System - Application Configuration
# ===================================================================

server.port=8080

# ---------------- MySQL Database ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/smart_fleet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
# update = keep existing data in smart_fleet DB (created by database/schema.sql) and
# only auto-adjust the schema if entities change. Use create/create-drop only if you
# want Hibernate to build tables itself instead of running schema.sql manually.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ---------------- Jackson ----------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------- CORS (frontend served separately, e.g. via Live Server) ----------------
fleet.cors.allowed-origins=*

# ---------------- Logging ----------------
logging.level.com.fleet=INFO
